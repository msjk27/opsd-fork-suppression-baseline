name: Research CPU checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -v
      - run: python -m research.run --config configs/research/vanilla_4096.json --run-id ci --dry-run
      - run: pip install transformers==4.57.1 datasets==4.3.0
      - run: python -m tests.smoke_probe
